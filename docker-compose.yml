# Runs the talent API (this repo) and the talent dashboard locally. The dashboard is the
# no10-hackathon-frontend/ submodule: our fork of magerags/no10-hackathon (see README).
#   git submodule update --init && docker compose up --build    then open http://localhost:5173
services:
  api:
    build: .
    env_file: .env  # API_KEY (what clients send as x-api-key), OPENAI_API_KEY and the tools' keys
    environment:
      LOCAL_DATA_DIR: /data  # cache searches in ./api-cache instead of Vercel Blob
    volumes:
      - ./api-cache:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      # Node runs Vite and the Nitro dev server; Bun installs packages from bun.lock.
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
        RUN npm install -g bun@1
    working_dir: /app
    env_file: ./no10-hackathon-frontend/.dev.vars  # the dashboard's settings: database, keys, TALENT_API_URL
    environment:
      PORT: "5173"  # the dev server's port, which local workflow runs call back on
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./no10-hackathon-frontend:/app
      - frontend-node-modules:/app/node_modules  # Linux packages, kept apart from the host folder
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  frontend-node-modules:
